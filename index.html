<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfert de fichiers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 550px;
            padding: 35px;
            background: #191c22;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        h1 {
            margin-top: 0;
        }

        .drop-zone {
            border: 2px dashed #555;
            border-radius: 15px;
            padding: 40px 20px;
            margin: 25px 0;
            cursor: pointer;
            transition: .2s;
        }

        .drop-zone:hover {
            border-color: #888;
            background: #20242b;
        }

        #fileInput {
            display: none;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #uploadBtn {
            background: white;
            color: black;
        }

        #uploadBtn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        progress {
            width: 100%;
            margin-top: 20px;
        }

        #result {
            margin-top: 25px;
        }

        .link {
            display: block;
            margin: 15px 0;
            padding: 12px;
            background: #101217;
            border-radius: 10px;
            color: #7db7ff;
            word-break: break-all;
        }

        .copy {
            background: #30343c;
            color: white;
        }

        .error {
            color: #ff7070;
        }

        .success {
            color: #7dff9b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Transfert de fichiers</h1>

    <p>Envoie un fichier et obtiens un lien.</p>

    <label class="drop-zone" id="dropZone">
        <span id="fileText">
            Clique ici pour sélectionner un fichier
        </span>

        <input type="file" id="fileInput">
    </label>

    <button id="uploadBtn" disabled>
        Envoyer le fichier
    </button>

    <progress id="progress" value="0" max="100" hidden></progress>

    <div id="result"></div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const fileText = document.getElementById("fileText");
const uploadBtn = document.getElementById("uploadBtn");
const progress = document.getElementById("progress");
const result = document.getElementById("result");
const dropZone = document.getElementById("dropZone");

fileInput.addEventListener("change", () => {

    if (fileInput.files.length > 0) {

        const file = fileInput.files[0];

        fileText.textContent =
            file.name + " (" + formatSize(file.size) + ")";

        uploadBtn.disabled = false;
    }
});

dropZone.addEventListener("dragover", (event) => {
    event.preventDefault();
});

dropZone.addEventListener("drop", (event) => {

    event.preventDefault();

    if (event.dataTransfer.files.length > 0) {

        fileInput.files = event.dataTransfer.files;

        const file = fileInput.files[0];

        fileText.textContent =
            file.name + " (" + formatSize(file.size) + ")";

        uploadBtn.disabled = false;
    }
});

uploadBtn.addEventListener("click", upload);

function upload() {

    const file = fileInput.files[0];

    if (!file) {
        return;
    }

    const formData = new FormData();

    formData.append("file", file);

    result.innerHTML = "";
    progress.hidden = false;
    progress.value = 0;
    uploadBtn.disabled = true;

    const xhr = new XMLHttpRequest();

    xhr.open("POST", "upload.php");

    xhr.upload.addEventListener("progress", (event) => {

        if (event.lengthComputable) {

            progress.value =
                (event.loaded / event.total) * 100;
        }
    });

    xhr.addEventListener("load", () => {

        uploadBtn.disabled = false;

        try {

            const data = JSON.parse(xhr.responseText);

            if (!data.success) {

                result.innerHTML =
                    `<p class="error">${escapeHtml(data.error)}</p>`;

                return;
            }

            result.innerHTML = `

                <p class="success">
                    Fichier envoyé !
                </p>

                <div class="link" id="fileLink">
                    ${escapeHtml(data.url)}
                </div>

                <button class="copy" onclick="copyLink('${data.url}')">
                    Copier le lien
                </button>
            `;

        } catch {

            result.innerHTML =
                `<p class="error">
                    Réponse invalide du serveur.
                </p>`;
        }
    });

    xhr.addEventListener("error", () => {

        uploadBtn.disabled = false;

        result.innerHTML =
            `<p class="error">
                Impossible de contacter le serveur.
            </p>`;
    });

    xhr.send(formData);
}

function copyLink(url) {

    navigator.clipboard.writeText(url);

    result.querySelector(".copy").textContent =
        "Lien copié !";
}

function formatSize(bytes) {

    if (bytes < 1024)
        return bytes + " octets";

    if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " Ko";

    if (bytes < 1024 * 1024 * 1024)
        return (bytes / 1024 / 1024).toFixed(1) + " Mo";

    return (bytes / 1024 / 1024 / 1024).toFixed(1) + " Go";
}

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
